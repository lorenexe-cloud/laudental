backend:
  name: github
  repo: lorenexe-cloud/laudental
  branch: main
  base_url: https://TU-AUTENTICADOR.workers.dev
  auth_endpoint: auth

media_folder: "img/uploads"
public_folder: "/img/uploads"
publish_mode: simple
locale: es

collections:
  - name: "configuracion"
    label: "Sitio Lau Dental"
    files:
      - name: "contenido"
        label: "Contenido general"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "Sitio"
            name: "site"
            widget: "object"
            fields:
              - { label: "Título del navegador", name: "title", widget: "string" }
              - { label: "Descripción SEO", name: "description", widget: "text" }
              - { label: "Logo", name: "logo", widget: "image" }
              - { label: "Correo", name: "email", widget: "string" }
          - label: "Portada"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Texto superior", name: "eyebrow", widget: "string" }
              - { label: "Título principal", name: "title", widget: "string" }
              - { label: "Descripción", name: "text", widget: "text" }
              - { label: "Botón principal", name: "primaryButton", widget: "string" }
              - { label: "Botón WhatsApp", name: "secondaryButton", widget: "string" }
          - label: "Nosotros"
            name: "about"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Primer párrafo", name: "paragraph1", widget: "text" }
              - { label: "Segundo párrafo", name: "paragraph2", widget: "text" }
              - { label: "Puntos destacados", name: "highlights", widget: "list" }
          - label: "Tratamientos"
            name: "treatments"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Ícono", name: "icon", widget: "string", required: false }
          - label: "Especialistas"
            name: "doctors"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Especialidad", name: "specialty", widget: "string" }
              - { label: "Fotografía", name: "image", widget: "image" }
              - { label: "Formación y cédulas", name: "credentials", widget: "list" }
          - label: "Contacto"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Teléfono visible", name: "phoneDisplay", widget: "string" }
              - { label: "Teléfono internacional", name: "phoneInternational", widget: "string" }
              - { label: "WhatsApp con código de país", name: "whatsappNumber", widget: "string" }
              - { label: "Dirección", name: "address", widget: "string" }
              - { label: "Horario", name: "hours", widget: "string" }
              - { label: "Enlace de Google Maps", name: "mapUrl", widget: "string" }
              - { label: "Mensaje inicial de WhatsApp", name: "defaultWhatsappMessage", widget: "text" }
